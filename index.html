<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Web Workshop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#16213e;flex-shrink:0}
.title{font-weight:700;color:#e94560}
.hdr-right{display:flex;gap:10px;align-items:center;font-size:13px;color:#aaa}
.hdr-right b{color:#e94560}
.quit{background:none;border:1px solid #e94560;color:#e94560;border-radius:6px;padding:3px 8px;font-size:12px}
.nbar{text-align:center;padding:6px;background:#0f3460;font-weight:700;font-size:14px;flex-shrink:0}
.nbar b{color:#e94560;font-size:18px}
.prog{height:3px;background:#0f3460;flex-shrink:0}
.prog div{height:100%;background:#e94560;width:0;transition:width .3s}
.board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}
.note{font-size:56px;font-weight:800;color:#e94560;height:64px;line-height:64px}
.status{text-align:center;font-size:14px;color:#aaa;min-height:20px;padding:0 10px}
.keyboard{position:relative;height:190px;margin:0 6px 14px;flex-shrink:0}
.wk{position:absolute;top:0;bottom:0;width:14.2857%;background:#f7f7f7;border:1px solid #888;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:20px;font-weight:700;color:#333;cursor:pointer}
.bk{position:absolute;top:0;width:8.8%;height:62%;background:#151515;border-radius:0 0 5px 5px;z-index:2;box-shadow:0 3px 5px rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;text-align:center;font-size:10px;line-height:1.15;color:#ccc;cursor:pointer}
.wk.pressed,.bk.pressed{background:#5dade2}
.wk.right,.bk.right{background:#2ecc71;color:#fff;border-color:#27ae60}
.wk.wrong,.bk.wrong{background:#e74c3c;color:#fff;border-color:#c0392b}
.ov{position:fixed;inset:0;background:rgba(26,26,46,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;z-index:100}
.ov.hide{display:none}
.ov h2{color:#e94560;font-size:24px;margin-bottom:10px}
.ov p{color:#aaa;font-size:14px;line-height:1.6;margin-bottom:6px}
.ov p b{color:#e94560}
.nsel{display:flex;align-items:center;gap:18px;margin-top:12px}
.nsel button{width:52px;height:52px;border-radius:12px;border:1px solid #e94560;background:none;color:#e94560;font-size:26px;font-weight:700}
.nsel span{font-size:40px;font-weight:800;color:#e94560;min-width:60px}
.btn{margin-top:18px;padding:14px 44px;background:#e94560;color:#fff;border:0;border-radius:10px;font-size:17px;font-weight:700}
</style>
</head>
<body>

<div class="ov" id="welcome">
  <h2>Web Workshop</h2>
  <p>A note plays and its name shows on screen.</p>
  <p>Tap the <b>key</b> of the note played <b id="w-n">2</b> steps back.<br>
     Green = correct. Red = wrong.</p>
  <p>The first <b id="w-n2">2</b> notes are for listening only.</p>
  <p>N-Back level</p>
  <div class="nsel">
    <button id="n-dec" aria-label="lower N">−</button>
    <span id="n-val">2</span>
    <button id="n-inc" aria-label="raise N">+</button>
  </div>
  <button class="btn" id="btn-start">Start</button>
</div>

<div class="ov hide" id="results">
  <h2>Done</h2>
  <p id="res-body"></p>
  <button class="btn" id="btn-again">Play Again</button>
</div>

<header>
  <div class="title">Web Workshop</div>
  <div class="hdr-right">
    <span><b id="tn">0</b>/<span id="tt">20</span></span>
    <button class="quit" id="btn-quit">Quit</button>
  </div>
</header>
<div class="nbar">N-Back: <b id="nl">2</b></div>
<div class="prog"><div id="pf"></div></div>

<div class="board">
  <div class="note" id="note"></div>
  <div class="status" id="st"></div>
</div>

<div class="keyboard" id="kb"></div>

<script>
// All 12 notes of one octave; every trial draws from this set.
const NOTES = ['C4','C#4','D4','D#4','E4','F4','F#4','G4','G#4','A4','A#4','B4'];
const FREQ = {C4:261.63,'C#4':277.18,D4:293.66,'D#4':311.13,E4:329.63,F4:349.23,'F#4':369.99,G4:392.00,'G#4':415.30,A4:440,'A#4':466.16,B4:493.88};
const BASE_REPS = 20;  // fixed reps added to every session
const REPS_PER_N = 8;  // plus N x 8 -> session length = 20 + N x 8
function sessionLength() { return BASE_REPS + N * REPS_PER_N; }
const STEP_MS = 2500, GAP_MS = 500;
const UP_PCT = 90;    // score above this -> N goes up
const DOWN_PCT = 60;  // score at or below this -> N goes down
const N_MIN = 1, N_MAX = 9;
const KEY_N = 'webworkshop.n';

function clampN(n) { return Math.min(N_MAX, Math.max(N_MIN, n)); }
let N = clampN(parseInt(localStorage.getItem(KEY_N), 10) || 2);
let total = sessionLength();
let hist = [], t = 0, cur = null, targetNote = null;
let active = false, scoring = false, answered = false;
let timer = null, ac = null;
let st = {correct:0, scored:0};
const keyEls = {};

const disp = n => n.replace('#', '♯').replace(/\d/, '');

// ---------- Audio ----------
function tone(name, dur = 0.5) {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  const f = FREQ[name], now = ac.currentTime;
  [[1,'triangle',0.3,dur],[2,'sine',0.1,dur*0.35],[0.5,'sine',0.07,dur*0.8]].forEach(([m,type,v,d]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f*m;
    g.gain.setValueAtTime(v, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + d);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + d + 0.05);
  });
}

// ---------- Keyboard: one octave, 7 white + 5 black ----------
function buildKeyboard() {
  const kb = document.getElementById('kb');
  kb.innerHTML = '';
  const WHITE = ['C4','D4','E4','F4','G4','A4','B4'];
  const BLACK = [[0,'C#4','C♯<br>D♭'],[1,'D#4','D♯<br>E♭'],[3,'F#4','F♯<br>G♭'],[4,'G#4','G♯<br>A♭'],[5,'A#4','A♯<br>B♭']];
  const W = 100 / 7;
  WHITE.forEach((n, i) => {
    const k = document.createElement('div');
    k.className = 'wk';
    k.style.left = (i * W) + '%';
    k.textContent = n.replace(/\d/, '');
    k.addEventListener('pointerdown', e => { e.preventDefault(); tapKey(n, k); });
    kb.appendChild(k);
    keyEls[n] = k;
  });
  BLACK.forEach(([i, n, lab]) => {
    const k = document.createElement('div');
    k.className = 'bk';
    k.style.left = ((i + 1) * W - 4.4) + '%';
    k.innerHTML = lab;
    k.addEventListener('pointerdown', e => { e.preventDefault(); tapKey(n, k); });
    kb.appendChild(k);
    keyEls[n] = k;
  });
}

function clearKeys() {
  Object.values(keyEls).forEach(k => k.classList.remove('right', 'wrong', 'pressed'));
}
function mark(el, ok) { el.classList.add(ok ? 'right' : 'wrong'); }
function flash(el) {
  el.classList.add('pressed');
  setTimeout(() => el.classList.remove('pressed'), 150);
}
function setStatus(s) { document.getElementById('st').textContent = s; }

// ---------- Input ----------
function tapKey(note, el) {
  tone(note, 0.45);
  flash(el);
  if (!active || !scoring || answered) return;
  answered = true;
  const ok = note === targetNote;
  mark(el, ok);
  if (!ok) mark(keyEls[targetNote], true);
  if (ok) st.correct++;
  setStatus(ok ? 'Correct' : `Wrong. It was ${disp(targetNote)}`);
}

// ---------- Trial flow ----------
function nextTrial() {
  if (t >= total) { finish(); return; }
  t++;
  document.getElementById('tn').textContent = t;
  document.getElementById('pf').style.width = (t / total * 100) + '%';

  cur = NOTES[Math.floor(Math.random() * NOTES.length)];
  hist.push(cur);
  scoring = hist.length > N;
  targetNote = scoring ? hist[hist.length - 1 - N] : null;
  answered = false;

  clearKeys();
  document.getElementById('note').textContent = disp(cur);
  tone(cur, 0.6);
  setStatus(scoring ? `Tap the key played ${N} back` : `Listen: ${t} of ${N}`);

  timer = setTimeout(endTrial, STEP_MS);
}

function endTrial() {
  if (scoring) {
    st.scored++;
    if (!answered) {
      mark(keyEls[targetNote], true);
      setStatus(`Missed. It was ${disp(targetNote)}`);
    }
  }
  scoring = false;   // close the window so late taps don't count
  answered = true;
  timer = setTimeout(nextTrial, GAP_MS);
}

function finish() {
  active = false;
  clearTimeout(timer);
  releaseWake();
  clearKeys();
  document.getElementById('note').textContent = '';
  const pct = st.scored ? Math.round(st.correct / st.scored * 100) : 0;
  const oldN = N;
  let newN = N;
  if (pct > UP_PCT) newN = clampN(N + 1);
  else if (pct <= DOWN_PCT) newN = clampN(N - 1);
  N = newN;
  localStorage.setItem(KEY_N, String(N));

  let verdict;
  if (newN > oldN) {
    verdict = `<b style="color:#2ecc71">Level up</b>: N ${oldN} → ${newN}. You scored above ${UP_PCT}%.`;
  } else if (newN < oldN) {
    verdict = `<b style="color:#e74c3c">Level down</b>: N ${oldN} → ${newN}. You scored ${DOWN_PCT}% or below.`;
  } else if (pct <= DOWN_PCT) {
    verdict = `<b>Level stays at N ${newN}</b> (already the minimum). You scored ${DOWN_PCT}% or below.`;
  } else {
    verdict = `<b>Level stays the same</b>: N ${newN}. You scored between ${DOWN_PCT + 1}% and ${UP_PCT}%.`;
  }

  document.getElementById('res-body').innerHTML =
    `Score: <b>${pct}%</b><br>${st.correct} of ${st.scored} correct<br><br>` +
    `${verdict}`;
  document.getElementById('results').classList.remove('hide');
}

// ---------- Keep screen awake ----------
let wakeLock = null;
async function acquireWake() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* not supported or denied: game still works */ }
}
function releaseWake() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && active) acquireWake();
});

function startGame() {
  if (ac && ac.state === 'suspended') ac.resume();
  clearTimeout(timer);
  acquireWake();
  total = sessionLength();
  active = true; t = 0; hist = []; cur = null; scoring = false; answered = false;
  st = {correct:0, scored:0};
  document.getElementById('welcome').classList.add('hide');
  document.getElementById('results').classList.add('hide');
  refreshHeader();
  document.getElementById('tn').textContent = '0';
  document.getElementById('pf').style.width = '0%';
  setStatus('Get ready');
  timer = setTimeout(nextTrial, 400);
}

function quitGame() {
  active = false;
  clearTimeout(timer);
  releaseWake();
  clearKeys();
  document.getElementById('note').textContent = '';
  setStatus('');
  refreshHeader();
  document.getElementById('welcome').classList.remove('hide');
}

// ---------- N selector ----------
function setN(n) {
  N = clampN(n);
  localStorage.setItem(KEY_N, String(N));
  refreshHeader();
}
function refreshHeader() {
  document.getElementById('nl').textContent = N;
  document.getElementById('n-val').textContent = N;
  document.getElementById('w-n').textContent = N;
  document.getElementById('w-n2').textContent = N;
  document.getElementById('tt').textContent = sessionLength();
}

// ---------- Init ----------
document.getElementById('n-dec').addEventListener('click', () => setN(N - 1));
document.getElementById('n-inc').addEventListener('click', () => setN(N + 1));
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-again').addEventListener('click', startGame);
document.getElementById('btn-quit').addEventListener('click', quitGame);
buildKeyboard();
refreshHeader();
</script>
</body>
</html>
